name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Validate the experiment notebook
        run: python -c "import nbformat; nbformat.validate(nbformat.read('notebooks/original_experiment.ipynb', as_version=4))"
      - run: pytest -q
      - name: Rebuild figures from the published results (no model needed)
        run: mam analyze results/benchmark_token_budget_summary.csv --n 200 --out /tmp/figures
